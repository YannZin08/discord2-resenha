<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Resenha</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1225" />
    <meta name="description" content="Converse com seus amigos por texto, voz e vídeo." />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="icon-64.png" />
    <link rel="apple-touch-icon" href="icon-512.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before the app boots, so there's no flash of the default one.
      try {
        var p = JSON.parse(localStorage.getItem('prefs') || '{}');
        if (p.theme) document.documentElement.dataset.theme = p.theme;
        if (p.chatFont) document.documentElement.style.setProperty('--chat-font', p.chatFont + 'px');
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
